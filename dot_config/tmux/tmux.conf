%if '#{<:#{version},3.8}'
set -g status-left-length 60
set -g status-left "#[fg=red]tmux 3.8 or newer is required for this config "
%else

# tmux detects Ghostty, WezTerm and iTerm2 and enables truecolor for them.
# Alacritty is not detected, so its truecolor support is declared here.
set -sa terminal-features ',alacritty:RGB'

# Mouse support for scrolling, selecting and pane focus
set -g mouse on

# Disable delay time between commands
set -s escape-time 0

# Longer display time for tmux messages
set -g display-time 2000

# Focus events are requested from the terminal if supported and passed through
# to applications
set -s focus-events on

# Increase scrollback buffer size
set -g history-limit 50000

# Automatically renumber tmux windows
set -g renumber-windows on

# Increase the refresh frequency of 'status-left' and 'status-right'
set -g status-interval 5

# Make window / pane index start with 1
set -g base-index 1
set -g pane-base-index 1

# Left side just shows my windows, no status element
set -g status-left ''

# Set length of status-right to a bigger value
set -g status-right-length 120

setw -g mode-keys emacs
set -g status-keys emacs

# Color-dependent settings are centralized in a dedicated shell script, enabling
# conditional branching to adapt to the chosen color scheme.
run $XDG_CONFIG_HOME/tmux/style.tmux

# Request extended keys (xterm modifyOtherKeys) from the terminal, so
# Ctrl+Shift combinations reach tmux key bindings and applications
set -s extended-keys on

# Prefix is Ctrl+Shift+Space
unbind C-b
set -g prefix C-S-Space
bind C-S-Space send-prefix

bind -n C-S-T new-window
bind -n C-S-S split-window -h -c "#{pane_current_path}"
bind -n C-S-U split-window -v -c "#{pane_current_path}"
bind -n C-S-W kill-pane
bind -n C-S-H select-pane -L
bind -n C-S-J select-pane -D
bind -n C-S-K select-pane -U
bind -n C-S-L select-pane -R
bind -n C-S-P previous-window
bind -n C-S-N next-window
bind -n C-S-\{ copy-mode \; send -X previous-prompt
bind -n -N 'Search' C-S-/ copy-mode \; command-prompt -i -p 'Search:' \
    'send -X search-backward-incremental "%%%"'
bind -n C-S-? send-keys -K C-S-/ # iTerm2 sends Ctrl+Shift+/ as C-S-?

# Copy mode holds only scrolling, mouse selection, prompt jumps and search
# navigation. Every other key leaves copy mode and reaches the shell, so typing
# while scrolled back returns to the prompt.
unbind -T copy-mode -a

# Hide the position indicator in the top right, however copy mode is entered
set -g copy-mode-position-format ''

bind -T copy-mode WheelUpPane select-pane \; send -X -N 5 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 5 scroll-down
bind -T copy-mode PPage send -X page-up
bind -T copy-mode NPage send -X page-down
bind -T copy-mode C-u send -X halfpage-up
bind -T copy-mode C-d send -X halfpage-down
bind -T copy-mode C-b send -X page-up
bind -T copy-mode C-f send -X page-down
bind -T copy-mode C-y send -X scroll-up
bind -T copy-mode C-e send -X scroll-down
bind -T copy-mode C-S-\{ send -X previous-prompt
bind -T copy-mode C-S-\} send -X next-prompt
bind -T copy-mode MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode MouseDown1Pane select-pane \; \
    if -F '#{selection_present}' { send -X clear-selection }
bind -T copy-mode MouseUp1Pane select-pane
bind -T copy-mode SecondClick1Pane select-pane
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; \
    send -X copy-pipe-no-clear
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; \
    send -X copy-pipe-no-clear

# Horizontal trackpad scrolling arrives as mouse buttons 6 and 7. Without
# bindings the Any fallback would leave copy mode.
bind -T copy-mode MouseDown6Pane select-pane
bind -T copy-mode MouseDown7Pane select-pane
bind -T copy-mode SecondClick6Pane select-pane
bind -T copy-mode SecondClick7Pane select-pane
bind -T copy-mode DoubleClick6Pane select-pane
bind -T copy-mode DoubleClick7Pane select-pane
bind -T copy-mode TripleClick6Pane select-pane
bind -T copy-mode TripleClick7Pane select-pane

# Enter and Shift+Enter cycle through search matches. Without an active search
# they leave copy mode and reach the shell like any other key.
bind -T copy-mode Enter if -F '#{search_present}' \
    { send -X search-again } { send -X cancel; send-keys Enter }
bind -T copy-mode S-Enter if -F '#{search_present}' \
    { send -X search-reverse } { send -X cancel; send-keys S-Enter }

# Escape clears search highlights and keeps the view. Without an active search
# it leaves copy mode. clear-selection also discards the search marks.
bind -T copy-mode Escape if -F '#{search_present}' \
    { send -X clear-selection } { send -X cancel }
bind -T copy-mode C-c send -X cancel

# Copy mode looks up keys before the root table. Re-sending the key to the
# client after leaving copy mode lets root bindings handle it.
bind -T copy-mode Any send -X cancel \; send-keys -K

bind -n C-S-D detach-client

# enter move mode
bind -n C-S-M set -g key-table move-pane

# exit move mode
bind -T move-pane Escape set -g key-table root
bind -T move-pane C-c    set -g key-table root
bind -T move-pane Enter set -g key-table root

# move panes
bind -T move-pane h   swap-pane -t '{left-of}'
bind -T move-pane C-S-H swap-pane -t '{left-of}'
bind -T move-pane j   swap-pane -t '{down-of}'
bind -T move-pane C-S-J swap-pane -t '{down-of}'
bind -T move-pane k   swap-pane -t '{up-of}'
bind -T move-pane C-S-K swap-pane -t '{up-of}'
bind -T move-pane l   swap-pane -t '{right-of}'
bind -T move-pane C-S-L swap-pane -t '{right-of}'

# cycle layouts
bind -T move-pane n   next-layout
bind -T move-pane C-S-N next-layout
bind -T move-pane p   previous-layout
bind -T move-pane C-S-P previous-layout

# move windows
bind -T move-pane [ swap-window -d -t -1
bind -T move-pane C-S-\{ swap-window -d -t -1
bind -T move-pane ] swap-window -d -t +1
bind -T move-pane C-S-\} swap-window -d -t +1

# Open the pane's scrollback in EDITOR, in a full-size popup with the cursor on
# the last line. The temporary file is removed when the editor exits.
bind -n C-S-E run-shell -b 'f=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX"); \
    tmux capture-pane -p -J -S - -t "#{pane_id}" > "$f"; \
    tmux display-popup -B -E -w 100% -h 100% -c "#{client_name}" \
    "${EDITOR:-nvim} + $f; rm -f $f"'

# Toggle a floating scratch terminal
bind -n C-S-Enter if -F '#{==:#{session_name},scratch}' { detach-client } {
    display-popup -E -w 80% -h 80% \
        "tmux new-session -A -s scratch -c '#{pane_current_path}' \\; set status off"
}

bind -n C-S-= run -C 'resize-pane -x #{e|+:#{pane_width},10} -y #{e|+:#{pane_height},4}'
bind -n C-S-+ send-keys -K C-S-= # iTerm2 sends Ctrl+Shift+= as C-S-+
bind -n C-S-_ run -C 'resize-pane -x #{e|-:#{pane_width},10} -y #{e|-:#{pane_height},4}'
bind -n C-S-- send-keys -K C-S-_ # WezTerm sends Ctrl+Shift+- as C-S--

bind -n C-S-R command-prompt -p "Rename:" "rename-window '%%'"

# Run 'chezmoi apply' in a new window. Wait for keyboard input (e.g. CR) in case
# the cmd did finish with an error.
bind -n -N 'Chezmoi apply' C-S-A new-window 'zsh -c "chezmoi apply || read -r"'

bind -n C-S-X send -R \; clear-history -H \; send C-l
bind -n C-S-Z resize-pane -Z
bind -n C-S-I break-pane
bind -n C-S-O choose-tree -s -Z
bind -n C-S-\; command-prompt
bind -n C-S-: command-prompt # Terminals that send the shifted character
bind -n C-S-B last-window

# Ctrl+Shift+number selects a window
bind -n C-S-1 select-window -t :=1
bind -n C-S-2 select-window -t :=2
bind -n C-S-3 select-window -t :=3
bind -n C-S-4 select-window -t :=4
bind -n C-S-5 select-window -t :=5
bind -n C-S-6 select-window -t :=6
bind -n C-S-7 select-window -t :=7
bind -n C-S-8 select-window -t :=8
bind -n C-S-9 select-window -t :=9

# iTerm2 sends Ctrl+Shift+number as the shifted character (US layout), Ghostty
# does so for 2 and 6
bind -n 'C-S-!' send-keys -K C-S-1
bind -n 'C-S-@' send-keys -K C-S-2
bind -n 'C-S-#' send-keys -K C-S-3
bind -n 'C-S-$' send-keys -K C-S-4
bind -n 'C-S-%' send-keys -K C-S-5
bind -n 'C-S-^' send-keys -K C-S-6
bind -n 'C-S-&' send-keys -K C-S-7
bind -n 'C-S-*' send-keys -K C-S-8
bind -n 'C-S-(' send-keys -K C-S-9

# Reload tmux.conf with CMD r
bind -n M-r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \;\
    display "Tmux Reloaded"

# Double and triple click outside copy mode behave like in copy mode: copy the
# word or line and stay in copy mode with the selection visible
bind -n DoubleClick1Pane select-pane -t = \; \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } \
    { copy-mode ; send -X select-word ; send -X copy-pipe-no-clear }
bind -n TripleClick1Pane select-pane -t = \; \
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } \
    { copy-mode ; send -X select-line ; send -X copy-pipe-no-clear }

# WezTerm sends Ctrl+Shift+letter as Ctrl+uppercase letter (C-T for C-S-T).
# Each Ctrl+Shift letter binding gets an alias for that form. Runs after all
# bindings are defined.
run 'for l in $(tmux list-keys -T root -F "##{key_string}" \
        | sed -n "s/^C-S-\([A-Z]\)$/\1/p"); do \
    tmux bind -n "C-$l" send-keys -K "C-S-$l"; \
done'

%endif
