# Packages with native Homebrew coverage are installed from the Brewfile.
# The core tools below have no brew alternative on this machine, so they're
# fetched directly from each project's own GitHub releases instead.
{{ if not .platform.brew }}
    {{ $rustArch := .chezmoi.arch }}
    {{ if eq $rustArch "amd64" }}{{ $rustArch = "x86_64" }}{{ end }}
    {{ if eq $rustArch "arm64" }}{{ $rustArch = "aarch64" }}{{ end }}
    {{ $rustOS := "unknown-linux-musl" }}
    {{ if eq .chezmoi.os "darwin" }}{{ $rustOS = "apple-darwin" }}{{ end }}

    {{ if .install.fd }}
    ['.local/bin/fd']
    type = 'archive-file'
    {{ $asset := printf "fd-*-%s-%s.tar.gz" $rustArch $rustOS }}
    url = '{{ gitHubLatestReleaseAssetURL "sharkdp/fd" $asset }}'
    path = 'fd'
    stripComponents = 1
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.fzf }}
    ['.local/bin/fzf']
    type = 'archive-file'
    {{ $asset := printf "fzf-*-%s_%s.tar.gz" .chezmoi.os .chezmoi.arch }}
    url = '{{ gitHubLatestReleaseAssetURL "junegunn/fzf" $asset }}'
    path = 'fzf'
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.lsd }}
    ['.local/bin/lsd']
    type = 'archive-file'
    {{ $asset := printf "lsd-*-%s-%s.tar.gz" $rustArch $rustOS }}
    url = '{{ gitHubLatestReleaseAssetURL "lsd-rs/lsd" $asset }}'
    path = 'lsd'
    stripComponents = 1
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.neovim }}
    ['.local/share/nvim-app']
    type = 'archive'
    {{ $os := "linux" }}
    {{ if eq .chezmoi.os "darwin" }}{{ $os = "macos" }}{{ end }}
    {{ $arch := .chezmoi.arch }}
    {{ if eq $arch "amd64" }}{{ $arch = "x86_64" }}{{ end }}
    {{ $asset := printf "nvim-%s-%s.tar.gz" $os $arch }}
    url = '{{ gitHubLatestReleaseAssetURL "neovim/neovim" $asset }}'
    stripComponents = 1
    refreshPeriod = '168h'

    # nvim-treesitter needs the tree-sitter CLI on PATH to install parsers.
    ['.local/bin/tree-sitter']
    type = 'archive-file'
    {{ $os := "linux" }}
    {{ if eq .chezmoi.os "darwin" }}{{ $os = "macos" }}{{ end }}
    {{ $arch := "x64" }}
    {{ if eq .chezmoi.arch "arm64" }}{{ $arch = "arm64" }}{{ end }}
    {{ $asset := printf "tree-sitter-cli-%s-%s.zip" $os $arch }}
    url = '{{ gitHubLatestReleaseAssetURL "tree-sitter/tree-sitter" $asset }}'
    path = 'tree-sitter'
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.ripgrep }}
    ['.local/bin/rg']
    type = 'archive-file'
    {{ $asset := printf "ripgrep-*-%s-%s.tar.gz" $rustArch $rustOS }}
    url = '{{ gitHubLatestReleaseAssetURL "BurntSushi/ripgrep" $asset }}'
    path = 'rg'
    stripComponents = 1
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.starship }}
    ['.local/bin/starship']
    type = 'archive-file'
    {{ $asset := printf "starship-%s-%s.tar.gz" $rustArch $rustOS }}
    url = '{{ gitHubLatestReleaseAssetURL "starship/starship" $asset }}'
    path = 'starship'
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.tinty }}
    ['.local/bin/tinty']
    type = 'archive-file'
    {{ $tintyOS := "unknown-linux-gnu" }}
    {{ if eq .chezmoi.os "darwin" }}{{ $tintyOS = "apple-darwin" }}{{ end }}
    {{ $asset := printf "tinty-%s-%s.tar.gz" $rustArch $tintyOS }}
    url = '{{ gitHubLatestReleaseAssetURL "tinted-theming/tinty" $asset }}'
    path = 'tinty'
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if .install.zellij }}
    ['.local/bin/zellij']
    type = 'archive-file'
    {{ $zellijOS := "unknown-linux-musl" }}
    {{ if eq .chezmoi.os "darwin" }}{{ $zellijOS = "apple-darwin" }}{{ end }}
    {{ $asset := printf "zellij-%s-%s.tar.gz" $rustArch $zellijOS }}
    url = '{{ gitHubLatestReleaseAssetURL "zellij-org/zellij" $asset }}'
    path = 'zellij'
    executable = true
    refreshPeriod = '168h'
    {{ end }}

    {{ if and .platform.gui .platform.nerdfonts }}
    {{ $fontDir := ".local/share/fonts" }}
    {{ if eq .chezmoi.os "darwin" }}{{ $fontDir = "Library/Fonts" }}{{ end }}

    ['{{ $fontDir }}/FiraCode']
    type = 'archive'
    url = '{{ gitHubLatestReleaseAssetURL "ryanoasis/nerd-fonts" "FiraCode.tar.xz" }}'
    include = ['*.ttf']
    refreshPeriod = '168h'

    ['{{ $fontDir }}/Meslo']
    type = 'archive'
    url = '{{ gitHubLatestReleaseAssetURL "ryanoasis/nerd-fonts" "Meslo.tar.xz" }}'
    include = ['*.ttf']
    refreshPeriod = '168h'
    {{ end }}
{{ end }}

{{ if .install.zsh }}
['.local/share/zsh/oh-my-zsh']
type = 'git-repo'
url = 'https://github.com/ohmyzsh/ohmyzsh.git'
refreshPeriod = '168h'

['.local/share/zsh/zsh-completions']
type = 'archive'
{{ $tag := (gitHubLatestRelease "zsh-users/zsh-completions").TagName }}
url = 'https://github.com/zsh-users/zsh-completions/archive/refs/tags/{{ $tag }}.tar.gz'
exact = true
stripComponents = 2
include = ['*/src/_*']
refreshPeriod = '168h'

['.local/share/zsh/zsh-autosuggestions']
type = 'git-repo'
url = 'https://github.com/zsh-users/zsh-autosuggestions.git'
refreshPeriod = '168h'

['.local/share/zsh/zsh-syntax-highlighting']
type = 'git-repo'
url = 'https://github.com/zsh-users/zsh-syntax-highlighting.git'
refreshPeriod = '168h'

['.local/share/zsh/zsh-transient-prompt']
type = 'git-repo'
url = 'https://github.com/olets/zsh-transient-prompt.git'
refreshPeriod = '168h'
{{ end }}

{{ if .install.zellij }}
['.local/share/zellij/zjstatus.wasm']
type = 'file'
url = 'https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm'
refreshPeriod = "169h"
{{ end }}
